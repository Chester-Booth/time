<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="icons/material-symbols.css" />
  <link rel="stylesheet" href="spectrum/spectrum.css" />
  <script src="vendor/jquery-3.7.1.min.js"></script>
  <script src="spectrum/spectrum.js"></script>
</head>
<body>
  <div id="container">
    <div id="time-date">
      <div id="time">00:00:00</div>
      <div id="date">Monday Jan 01</div>
      <div id="favicons"></div>
    </div>
  </div>

  <div id="controls" class="top-right" aria-label="Page controls">
    <button id="rotate" class="icon-button material-symbols-outlined" type="button" title="Rotate clock" aria-label="Rotate clock">rotate_left</button>
    <button id="cog" class="icon-button material-symbols-outlined" type="button" title="Open settings" aria-label="Open settings">settings</button>
  </div>

  <div id="popup" aria-hidden="true">
    <div id="popup-boxes-container">
      <div id="popup-background"></div>

      <button id="close" title="Close settings" aria-label="Close settings" class="icon-button material-symbols-outlined" type="button">close</button>
      <!-- settings -->
      <div class="popup-boxes">
        <div class="settings-row">
          <div id="settings-icon" class="material-symbols-outlined" aria-hidden="true">settings</div>
          <h1>Settings</h1>
        </div>
      </div>

      <!-- colour pickers -->
      <div class="popup-boxes" id="colour-settings">
        <label>Colours</label>
        <label for="BG-colour-picker">Background</label>
        <div class="colour-inputs">
          <input type="text" id="BG-colour-picker" class="popup-input" />
        </div>

        <label for="TXT-colour-picker">Text</label>
        <div class="colour-inputs">
          <input type="text" id="TXT-colour-picker" class="popup-input" />
        </div>

        <button id="reset_settings_colours" title="Reset colours to default" aria-label="Reset colours to default" class="icon-button material-symbols-outlined" type="button">reset_settings</button>
      </div>

      <!-- text -->
      <div class="popup-boxes" id="text-settings">
        <label>Text</label>
        <div class="text-picker">
          <label for="font">Font</label>
          <div class="font-picker">
            <input type="text" id="font" class="popup-input" />
            <button id="save-text-button" title="Save font name" aria-label="Save font name" class="icon-button material-symbols-outlined" type="button">save</button>
          </div>
          <p id="font-preview">Preview</p>
          <div class="note" id="Text-Settings-Note"> Note:</div>
        </div>
        <div class="text-picker">
          <label for="size-number">Size</label>
          <div class="size-picker">
            <input type="number" id="size-number" min="24" max="180" step="1">
            <input type="range" id="size-range" min="24" max="180" step="1">
          </div>
        </div>
        <div class="text-picker">
          <label for="height-number">Height</label>
          <div class="height-picker">
            <input type="number" id="height-number" min="-320" max="320">
            <input type="range" id="height-range" min="-320" max="320">
          </div>
        </div>
        <button id="reset_settings_text" title="Reset text settings to default" aria-label="Reset text settings to default" class="icon-button material-symbols-outlined" type="button">reset_settings</button>
      </div>

      <!-- shortcuts -->
      <div class="popup-boxes">
        <label>Shortcuts</label>
        <div id="add-shortcut">
          <input type="text" id="key" maxlength="1" placeholder="Key" class="popup-input" aria-label="Shortcut key">
          <input type="text" id="url" placeholder="URL" class="popup-input" aria-label="Shortcut URL">
          <button id="save-shortcuts-button" title="Save shortcut" aria-label="Save shortcut" class="icon-button material-symbols-outlined" type="button">save</button>
        </div>
        <p id="shortcut-status" class="status" aria-live="polite"></p>
        <hr>
        <label>Saved</label>
        <div id="saved-shortcuts"></div>
        <div class="popup-buttons"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
